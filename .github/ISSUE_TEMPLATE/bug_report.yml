name: Bug Report
description: Report a TerraTierCurrency issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TerraTierCurrency version
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server version
      placeholder: "Paper 1.21.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Set ...
        3. See ...
