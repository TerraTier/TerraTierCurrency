name: Build and Deploy

on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        shell: pwsh
        run: .\gradlew.bat build

      - name: Prepare deploy jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path build\libs -Filter "TerraTierCurrency-*.jar" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $jar) {
            throw "No TerraTierCurrency jar was built."
          }

          Copy-Item -LiteralPath $jar.FullName -Destination build\libs\TerraTierCurrency.jar -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerraTierCurrency
          path: build/libs/TerraTierCurrency.jar

      - name: Validate SFTP secrets
        shell: pwsh
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          $missing = @()
          if (-not $env:SFTP_HOST) { $missing += "SFTP_HOST" }
          if (-not $env:SFTP_USERNAME) { $missing += "SFTP_USERNAME" }
          if (-not $env:SFTP_PASSWORD) { $missing += "SFTP_PASSWORD" }
          if (-not $env:SFTP_REMOTE_DIR) { $missing += "SFTP_REMOTE_DIR" }

          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }

      - name: Install WinSCP
        shell: pwsh
        run: choco install winscp -y --no-progress

      - name: Deploy over SFTP
        shell: pwsh
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_HOSTKEY: ${{ secrets.SFTP_HOSTKEY }}
        run: |
          if (-not $env:SFTP_PORT) {
            $env:SFTP_PORT = "22"
          }

          Add-Type -Path "C:\Program Files (x86)\WinSCP\WinSCPnet.dll"

          $sessionOptions = New-Object WinSCP.SessionOptions -Property @{
            Protocol = [WinSCP.Protocol]::Sftp
            HostName = $env:SFTP_HOST
            PortNumber = [int]$env:SFTP_PORT
            UserName = $env:SFTP_USERNAME
            Password = $env:SFTP_PASSWORD
          }

          if ($env:SFTP_HOSTKEY) {
            $sessionOptions.SshHostKeyFingerprint = $env:SFTP_HOSTKEY
          } else {
            $sessionOptions.GiveUpSecurityAndAcceptAnySshHostKey = $true
          }

          $session = New-Object WinSCP.Session
          try {
            $session.Open($sessionOptions)

            $transferOptions = New-Object WinSCP.TransferOptions
            $transferOptions.TransferMode = [WinSCP.TransferMode]::Binary

            $result = $session.PutFiles(
              "build\libs\TerraTierCurrency.jar",
              "$($env:SFTP_REMOTE_DIR.TrimEnd('/'))/TerraTierCurrency.jar",
              $false,
              $transferOptions
            )

            $result.Check()
          } finally {
            $session.Dispose()
          }
